name: Autonomic
description: 'Autonomic is a connected-vehicle cloud company founded in 2016, acquired by Ford Motor
  Company in 2018 and fully integrated into Ford in 2023. Its flagship product, the Transportation
  Mobility Cloud (TMC), is one of the largest connected-vehicle cloud platforms in production, providing
  an API-driven platform for developers to build applications that interact with vehicles while abstracting
  the complexity of different vehicle models and connectivity devices. The public developer surface (the
  TMC Developer Portal) is gated behind partner authentication, so most technical artifacts are not
  publicly harvestable. This profile was surfaced as a portfolio company of Craft Ventures and added to
  the API Evangelist network for enrichment.'
